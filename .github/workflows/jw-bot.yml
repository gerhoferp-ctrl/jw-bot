name: Bot novità JW.ORG

on:
  schedule:
    - cron: "*/30 * * * *"   # ogni 30 minuti
  workflow_dispatch:          # permette di avviarlo a mano
  push:                       # parte anche quando cambia lo script
    paths:
      - "jw_bot.py"
      - ".github/workflows/jw-bot.yml"

permissions:
  contents: write

concurrency:
  group: jw-bot
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests beautifulsoup4

      - name: Controlla novità e invia su Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python jw_bot.py

      - name: Salva l'elenco degli articoli già visti
        if: always()
        run: |
          git config user.name "jw-bot"
          git config user.email "jw-bot@users.noreply.github.com"
          for f in seen.json chat_id.txt; do [ -f "$f" ] && git add "$f"; done
          git diff --cached --quiet && exit 0
          git commit -m "Aggiorna articoli visti"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          echo "Impossibile salvare lo stato" && exit 1
